# 部署 override:app 綁主機 HTTP_PORT(同機多環境各用不同埠;獨佔主機設 80 免帶埠)。
# 刻意不給預設值:漏填直接 fail,不默默退回 80。
services:
  app:
    # log 輪替:docker 預設的 json-file driver 沒有上限,長期運行會填滿主機磁碟。
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - "${HTTP_PORT:?請在主機的 .env.<env> 設定}:80"

name: CI/CD

# Trunk-based:PR 與 main 只跑測試、lint 與 build 檢查;只有 Release(vX.Y.Z tag)才把靜態檔發佈到 GitHub Pages。
# 發版與退回舊版的做法見 docs/deployment.md。
on:
  push:
    branches: [main]
    # 只認 Release 的形狀:「是 tag 就發佈」的話,latest、wip 這類 tag 也會換掉發佈出去的版本
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main]
  # 退回舊版用:在舊的 tag 上手動跑一次,用的是那個 tag 的原始碼與 workflow
  workflow_dispatch:

# 同一個 ref 一次只跑一條;PR 的新 commit 直接取消舊 run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 跑在 dev stage 容器裡,與本機 make test / make lint 同一套環境
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target dev -t dev .
      - run: docker run --rm dev npm test
      - run: docker run --rm dev npm run lint
      - run: docker run --rm dev npm run format:check

  # 每次都 build 靜態檔:PR 與 main 上只當 build 檢查,Release 上 build 出來的就是要發佈的那份
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target site --output type=local,dest=dist .
      - if: github.ref_type == 'tag'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # 測試沒過就不發佈
  deploy:
    needs: [test, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # github-pages environment 預設只允許 default branch 部署,要另外放行 v*.*.* 的 tag(見 docs/deployment.md)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 兩個 Release 同時要發佈時排隊,不取消已經開始的那一次
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

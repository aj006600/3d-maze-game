# 本機開發 override:make local 用它在 localhost:3000 開 dev stage 的 Vite dev server。dev server 讀掛載進去的原始碼,存檔後畫面立即更新。
# 撞埠(例如另一個 worktree 也在跑 make local)時從 shell 換:PORT=3001 make local
# 埠只發佈到 loopback:同一個網路上的別台機器連不到你的開發環境;在遠端主機上開發就用 SSH / VS Code 把埠轉接過來
services:
  app:
    build:
      context: .
      target: dev            # dev stage 的 CMD 就是 Vite dev server
    volumes:
      # 整個 checkout 掛進去:原始碼、index.html 與 vite.config.js 改了都不必重新 build
      - .:/app
      # 開發機不裝 Node,沒有自己的 node_modules。這個匿名 volume 擋住上一行的掛載,
      # 留下 image 裡 npm ci 裝好的那份。container 重建時 compose 會沿用舊的 volume,
      # 所以相依改了要先 down 再 up,volume 裡的才會換成新 image 的那份
      - /app/node_modules
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
